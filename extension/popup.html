<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 330px; margin: 0; font: 13px/1.4 -apple-system, system-ui, sans-serif; color: #1f1e1d; background: #faf9f7; }
      .wrap { padding: 13px 14px 14px; }
      h1 { margin: 0; font: 600 13px system-ui; color: #c15f3c; }
      .title { margin: 7px 0 3px; font-weight: 600; font-size: 13px; line-height: 1.35; max-height: 36px; overflow: hidden; }
      .url { font: 11px/1.3 ui-monospace, monospace; color: #a8a29e; word-break: break-all; max-height: 15px; overflow: hidden; }
      .existing { margin-top: 9px; font-size: 12px; }
      .existing .badge { color: #2e7d32; font-weight: 600; }
      .existing .chips { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 4px; }
      .existing .chip { background: #edf3ee; color: #3f6b47; border-radius: 6px; padding: 2px 7px; font-size: 11px; }
      .existing .none { color: #a8a29e; font-size: 11.5px; }
      label { display: block; font-size: 11px; color: #78716c; margin: 12px 0 4px; }
      input { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #e7e5e4; border-radius: 8px; font-size: 13px; outline: none; background: #fff; }
      input:focus { border-color: #c15f3c; }

      .crumbs { font-size: 11.5px; color: #78716c; margin: 8px 0 6px; }
      .crumb { color: #c15f3c; cursor: pointer; }
      .crumb:hover { text-decoration: underline; }

      .list { border: 1px solid #eceae8; border-radius: 8px; max-height: 158px; overflow-y: auto; background: #fff; }
      .row { display: flex; align-items: center; justify-content: space-between; padding: 7px 10px; cursor: pointer; border-bottom: 1px solid #f2f0ee; }
      .row:last-child { border-bottom: 0; }
      .row:hover { background: #f7f2ef; }
      .row.create .lbl { color: #c15f3c; font-weight: 600; }
      .row.create b { font-weight: 700; }
      .lbl { font-size: 12.5px; }
      .lbl small { color: #a8a29e; }
      .arr { color: #c15f3c; font-weight: 700; }
      .empty { padding: 10px; font-size: 12px; color: #a8a29e; }

      .chosen { margin-top: 8px; font-size: 12px; }
      .chosen b { color: #1f1e1d; }
      .clr { color: #c62828; cursor: pointer; margin-left: 6px; }

      button { margin-top: 13px; width: 100%; padding: 9px; border: 0; border-radius: 8px; background: #c15f3c; color: #fff; font: 600 13px system-ui; cursor: pointer; }
      button:disabled { opacity: .55; cursor: default; }
      .status { margin-top: 9px; font-size: 12px; min-height: 16px; }
      .ok { color: #2e7d32; } .err { color: #c62828; } .muted { color: #78716c; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>⛏ Save to Cairn</h1>
      <div class="title" id="title">…</div>
      <div class="url" id="url"></div>
      <div class="existing" id="existing"></div>

      <label id="fileLabel">File into a collection / branch (optional)</label>
      <input id="filter" placeholder="type to search all branches…" autocomplete="off" />
      <div class="crumbs" id="crumbs"></div>
      <div class="list" id="list"></div>
      <div class="chosen" id="chosen"></div>

      <label>Extra tags (optional, comma-separated)</label>
      <input id="tags" placeholder="to-read, important" autocomplete="off" />

      <button id="save">Save</button>
      <div class="status muted" id="status"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
